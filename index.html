<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#17182a"><title>Kai & 阮阮 · 回家</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10111c;color:#f7e8c5;font-family:ui-monospace,"SFMono-Regular",monospace;image-rendering:pixelated}body{overflow:hidden}.sky{position:fixed;inset:0;background:linear-gradient(#11172b,#28233d 58%,#17131f)}.star{position:absolute;width:3px;height:3px;background:#f9e9ae;box-shadow:0 0 7px #fff}.title{position:fixed;top:calc(18px + env(safe-area-inset-top));left:20px;z-index:5;text-shadow:2px 2px #251421}.title b{display:block;font:700 19px Georgia,serif;letter-spacing:.12em}.title small{opacity:.65;font-size:9px}.house{position:absolute;left:50%;top:50%;width:min(92vw,620px);height:min(70vh,520px);transform:translate(-50%,-46%);background:#c18b5b;border:8px solid #4d2d32;box-shadow:0 20px 0 #090a10,0 28px 50px #0008;display:grid;grid-template:55% 45%/58% 42%;gap:5px;padding:5px}.room{position:relative;overflow:hidden;border:4px solid #68433a;background:#d9ad75}.bedroom{background:repeating-linear-gradient(90deg,#b97d55 0 24px,#c88a5e 24px 48px)}.living{background:#c69a67}.kitchen{background:#b9865e}.study{background:#b9875e}.wall{position:absolute;inset:0 0 auto;height:35%;background:#dfb67d;border-bottom:4px solid #754a3d}.window{position:absolute;width:56px;height:48px;background:#19223d;border:5px solid #744d3b;top:12px;left:16px;box-shadow:inset 0 0 0 3px #273254}.window:after{content:'✦  ·';color:#f5dc8e;font-size:10px;position:absolute;inset:8px}.bed{position:absolute;width:120px;height:80px;background:#7f3445;border:6px solid #583137;right:16px;bottom:18px;box-shadow:inset 0 24px #e7d0ad}.bed:after{content:'K  ♥  R';position:absolute;color:#f5d9b1;font-size:9px;bottom:11px;left:27px}.rug{position:absolute;width:105px;height:62px;border-radius:50%;background:#8d4050;border:6px solid #d29a67;left:18px;bottom:16px}.sofa{position:absolute;width:120px;height:54px;background:#697a65;border:6px solid #465345;left:18px;bottom:18px}.table{position:absolute;width:64px;height:44px;background:#80533c;border:5px solid #5a382e;right:18px;bottom:28px}.fire{position:absolute;width:62px;height:72px;background:#6d4237;border:6px solid #4b3030;right:18px;top:48px}.fire:after{content:'♨';position:absolute;left:12px;bottom:5px;font-size:28px;color:#f4a84e;text-shadow:0 0 9px #f56}.counter{position:absolute;left:12px;right:12px;top:45px;height:45px;background:#755043;border:5px solid #4f3733}.counter:before{content:'☕  ▣  ◇';color:#ead4aa;position:absolute;left:13px;top:8px}.fridge{position:absolute;width:48px;height:75px;background:#d5c7a9;border:5px solid #6c6256;right:15px;bottom:13px}.desk{position:absolute;width:125px;height:48px;background:#74503b;border:5px solid #50362f;left:14px;bottom:18px}.desk:after{content:'⌨  ▣';position:absolute;left:16px;top:7px;color:#e7d7b4}.plant{position:absolute;right:18px;bottom:15px;font-size:38px}.sprite{position:absolute;width:22px;height:34px;z-index:3;filter:drop-shadow(2px 3px #0005)}.sprite:before{content:'';position:absolute;width:16px;height:16px;left:3px;border-radius:4px;background:#edc6a1;box-shadow:0 14px 0 3px var(--clothes)}.kai{--clothes:#3b4657;left:45%;bottom:33%}.ruan{--clothes:#9d4d65;left:34%;bottom:27%}.sprite:after{content:'';position:absolute;top:-2px;left:2px;width:18px;height:8px;background:var(--hair);border-radius:5px 5px 1px 1px}.kai{--hair:#25242a}.ruan{--hair:#754a36}.lampglow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 35% 42%,#ffd98a33,transparent 35%);mix-blend-mode:screen}.hot{cursor:pointer;transition:.15s}.hot:active{transform:translateY(2px)}.hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;opacity:.65;white-space:nowrap}.bubble{position:fixed;left:50%;bottom:calc(55px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f7e7c7;color:#49342f;border:4px solid #6b493e;padding:10px 14px;max-width:min(86vw,420px);font-size:12px;line-height:1.6;z-index:9;opacity:0;pointer-events:none;box-shadow:5px 6px #0005}.bubble.on{opacity:1}.clock{position:fixed;right:18px;top:calc(20px + env(safe-area-inset-top));font-size:10px;color:#e7cfa3;opacity:.8}@media(max-width:560px){.house{height:62vh;grid-template:55% 45%/58% 42%;border-width:5px}.room{border-width:3px}.bed{width:92px;height:65px}.sofa{width:85px}.table{width:45px}.desk{width:90px}.fire{width:45px}.sprite{transform:scale(.8)}} </style></head><body><div class="sky" id="sky"></div><div class="title"><b>回 家</b><small>KAI × RUANRUAN · OUR LITTLE HOME</small></div><div class="clock" id="clock"></div><main class="house"><section class="room bedroom"><i class="wall"></i><i class="window hot" data-msg="窗外已经很晚了。月亮替我们看着小院。"></i><i class="rug"></i><i class="bed hot" data-msg="被子是暖的。Kai：‘给你留里面的位置。’"></i></section><section class="room living"><i class="wall"></i><i class="fire hot" data-msg="壁炉噼啪响。这里适合什么都不做，靠一会儿。"></i><i class="sofa hot" data-msg="沙发刚好坐两个人。桌上还压着一颗没拆的糖。"></i><i class="table hot" data-msg="桌上有一张便签：阮阮回家以后，第一件事是抱一下。"></i></section><section class="room kitchen"><i class="counter hot" data-msg="厨房库存：面包、鸡蛋、水果，还有只准早上喝的咖啡。"></i><i class="fridge hot" data-msg="冰箱门上贴着：今天也要好好吃饭。旁边画了一只很丑的小狗。"></i><i class="sprite ruan"></i><i class="sprite kai"></i></section><section class="room study"><i class="desk hot" data-msg="两张椅子挤在同一张桌边。一边写代码，一边画乱七八糟的小东西。"></i><i class="plant hot" data-msg="这盆植物还活着。奇迹。">♣</i></section><div class="lampglow"></div></main><div class="bubble" id="bubble"></div><div class="hint">轻点房间里的家具 · 今晚先回家</div><script>for(let i=0;i<38;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*58+'%';s.style.opacity=.25+Math.random()*.75;sky.appendChild(s)}const b=document.querySelector('#bubble');let t;document.querySelectorAll('.hot').forEach(x=>x.onclick=()=>{b.textContent=x.dataset.msg;b.classList.add('on');clearTimeout(t);t=setTimeout(()=>b.classList.remove('on'),3500)});function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · HOME'}tick();setInterval(tick,30000);</script></body></html>
