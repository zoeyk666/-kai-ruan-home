<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee6d7"><meta name="home-version" content="2.1.0"><meta name="description" content="Kai 与阮阮的像素小屋。走走、撸猫、泡茶，慢慢生活。"><title>回家 · Kai 与阮阮的小屋</title><link rel="stylesheet" href="./home-v2/style.css?v=2.1.0"><style>.heading-note{margin-left:12px}.utilities button{min-width:30px;min-height:30px}.viewport{isolation:isolate}#room{cursor:crosshair}.quiet{min-height:44px}.palette{flex-wrap:wrap}.note p{overflow-wrap:anywhere}.snapshot{display:block}.no-script{padding:30px}.heading h1{font-size:clamp(21px,3vw,32px)}@media(max-width:370px){.page{padding-left:10px;padding-right:10px}.heading-note{font-size:8px}.heading h1{font-size:21px}.time-options button{padding:5px}}</style><script defer src="./home-v2/app.js?v=2.1.0"></script></head><body>
<div class="page"><header class="masthead"><div class="brand"><i class="house-mark" aria-hidden="true"></i><div><strong>回家</strong><small>KAI & RUANRUAN</small></div></div><button class="quiet" data-action="help">小屋手册 <span>↗</span></button></header>
<div class="heading"><div><p class="eyebrow">A LITTLE HOME FOR TWO</p><h1>把世界，留在门外。</h1></div><p class="heading-note">有灯，有猫，<br>还有刚刚好的我们。</p></div>
<main class="layout"><section class="game-shell" aria-label="可以走动和互动的像素小屋"><div class="game-bar"><b><i class="status-dot"></i><span id="scene-status">夜晚 · 晴</span></b><div class="utilities"><button id="lamp-button" data-action="light" aria-label="开关屋内灯光" aria-pressed="true">灯</button><button id="sound-button" data-action="sound" aria-label="开启声音" aria-pressed="false">声</button><button data-action="help" aria-label="查看操作说明">?</button></div></div>
<div class="viewport"><canvas id="room" width="480" height="416" tabindex="0" aria-label="像素小屋，轻点地板走动，点家具互动。也可用下方家具入口。"></canvas><div class="scene-tag">HOME, SWEET HOME <span>01</span></div></div>
<div class="dialogue" aria-live="polite"><canvas id="portrait" width="32" height="32" aria-hidden="true"></canvas><div><strong id="speaker">Kai</strong><p id="speech">阮阮，回家啦。喜欢哪里就待在哪里。</p></div><span class="dialogue-star" aria-hidden="true">✧</span></div><div class="walk-hint"><span>轻点地板走动 · 轻点家具互动</span><button data-action="objects">家具入口 ↗</button></div></section>
<aside class="side"><section class="welcome-card"><div class="little-label">OUR SAVE FILE <span>✧</span></div><h2>不赶时间，<br>慢慢生活。</h2><p>茶是温的，灯是暖的。<br>今天在这里做一点小事，<br>或者什么也不做。</p><div class="residents"><span><i class="resident-dot blue"></i>Kai</span><span><i class="resident-dot pink"></i>阮阮</span><span><i class="resident-dot cream"></i>皮皮</span></div></section>
<nav class="dock" aria-label="小屋快捷入口"><button data-action="together"><canvas data-icon="heart" width="24" height="24" aria-hidden="true"></canvas><span>找 Kai<small>靠近一点</small></span></button><button data-action="notes"><canvas data-icon="note" width="24" height="24" aria-hidden="true"></canvas><span>小纸条<small>留一句话</small></span></button><button data-action="decor"><canvas data-icon="plant" width="24" height="24" aria-hidden="true"></canvas><span>布置小屋<small>换种心情</small></span></button><button data-action="photo"><canvas data-icon="camera" width="24" height="24" aria-hidden="true"></canvas><span>留张合影<small>把今天收好</small></span></button></nav>
<section class="weather-card"><div class="section-caption">窗外的天气 <small>由你决定</small></div><div class="segmented" aria-label="选择虚拟天气"><button data-weather="clear" aria-pressed="true">晴</button><button data-weather="rain" aria-pressed="false">雨</button><button data-weather="snow" aria-pressed="false">雪</button></div><div class="time-options" aria-label="选择小屋时间"><button data-time="day" aria-pressed="false">晨光</button><button data-time="dusk" aria-pressed="false">黄昏</button><button data-time="night" aria-pressed="true">夜晚</button></div></section><button class="collection" data-action="collection"><span>✧ 小小发现</span><span id="discovery-count">0 / 15</span></button></aside></main>
<footer><span>一屋 · 两人 · 慢慢生活</span><button data-action="backup">存档与备份</button><small>HOME 2.1</small></footer><p class="local-note" id="storage-note">进度与纸条只保存在当前浏览器，不上传；换设备前可导出备份。</p></div>
<dialog id="modal"><header><span id="modal-title">回家</span><button id="modal-close" aria-label="关闭弹窗">×</button></header><div id="modal-body"></div></dialog><div class="toast" id="toast" role="status"></div><noscript><p class="no-script">这座小屋需要开启 JavaScript。请用 Safari 或其他浏览器打开。</p></noscript></body></html>
